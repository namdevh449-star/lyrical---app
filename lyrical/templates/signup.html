<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Lyrical</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #1e1e2f 0%, #121212 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .form-box {
            background: #181818;
            padding: 40px;
            border-radius: 14px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        h2 {
            color: #1db954;
            margin-bottom: 25px;
            font-size: 26px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #282828;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus { border: 1px solid #1db954; }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #1db954;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #1ed760; transform: scale(1.02); }
        .error { color: #ff4d4d; margin-bottom: 10px; font-size: 13px; }
        p { margin-top: 18px; font-size: 14px; color: #b3b3b3; }
        a { color: #1db954; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>🎵 Sign Up</h2>
        {% if messages %}
            {% for message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="/login/">Login</a></p>
    </div>
</body>
</html>
